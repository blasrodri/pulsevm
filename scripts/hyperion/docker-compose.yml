services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms${HYPERION_ES_HEAP:-1g} -Xmx${HYPERION_ES_HEAP:-1g}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${HYPERION_ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  indexer:
    build:
      context: "${HYPERION_SOURCE_DIR:?set HYPERION_SOURCE_DIR}"
    command: ["indexer", "-c", "/etc/hyperion/config.toml"]
    volumes:
      - "${HYPERION_CONFIG_PATH:?set HYPERION_CONFIG_PATH}:/etc/hyperion/config.toml:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: "${HYPERION_SOURCE_DIR:?set HYPERION_SOURCE_DIR}"
    command: ["api", "-c", "/etc/hyperion/config.toml"]
    volumes:
      - "${HYPERION_CONFIG_PATH:?set HYPERION_CONFIG_PATH}:/etc/hyperion/config.toml:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${HYPERION_API_PORT:-7000}:7000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  esdata:
